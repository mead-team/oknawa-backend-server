version: '3.9'

services:
  app:
    container_name: oknawa_api
    build: .
    command: bash -c "alembic upgrade head && uvicorn app.main:app --forwarded-allow-ips='*' --proxy-headers --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./:/usr/src/app
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    env_file:
      - env/base.env
    networks:
      - oknawa-network

  nginx:
    container_name: oknawa_nginx
    image: nginx:latest
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf
      - ./letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    ports:
      - 80:80
      - 443:443
    depends_on:
      - app
    networks:
      - oknawa-network

  certbot:
    container_name: certbot
    image: certbot/certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - oknawa-network

  db:
    container_name: oknawa_db
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - env/prod.env
    ports:
      - 5433:5432
    networks:
      - oknawa-network

  redis:
    container_name: oknawa_redis
    image: redis:6.0-alpine
    env_file:
      - env/base.env
    ports:
      - 6379:6379
    networks:
      - oknawa-network

volumes:
  postgres_data:

networks:
  oknawa-network:
